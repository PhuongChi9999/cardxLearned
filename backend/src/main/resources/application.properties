spring.application.name=backend

#spring.datasource.url=jdbc:postgresql://localhost:5433/cardx_db
#spring.datasource.username=postgres
#spring.datasource.password=postgres

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/cardx_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

server.port=8080

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

openai.api.key=${OPENAI_API_KEY}
openai.model=${OPENAI_MODEL}

localai.base.url=${LOCALAI_BASE_URL:http://localai:8080/v1}
localai.api.key=${LOCALAI_API_KEY}
localai.model=${LOCALAI_MODEL}

app.upload.dir=/app/uploads