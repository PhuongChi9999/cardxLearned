services:
  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend

  backend:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/mydb
      SPRING_DATASOURCE_USERNAME: myuser
      SPRING_DATASOURCE_PASSWORD: Talachi99
      OPENAI_API_KEY: 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
      OPENAI_MODEL: gpt-5.4-mini
      SHARPAPI_API_KEY: APY0EC90rH2HzHBSSQT7Ep84pwNlT3luGltOrqWqhExR9FkAUIU6NhzVy7stFHMJkNh3lqLGwtUk
      LOCALAI_BASE_URL: http://localai:8081/v1
      LOCALAI_API_KEY: localai
      LOCALAI_MODEL: gpt-4
    depends_on:
      - db
      - localai

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: Talachi99
      POSTGRES_DB: mydb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  localai:
    image: localai/localai:latest-cpu
    ports:
      - "8081:8080"
    volumes:
      - ./localai-models:/build/models
    environment:
      - THREADS=2
volumes:
  postgres_data:
  localai_models: