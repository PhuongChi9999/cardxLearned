<h2>Créer un dossier</h2>

<div style="margin-top:20px;">
  <label>Nom du client</label><br>
  <input [(ngModel)]="nom" style="padding:8px; width:300px;" />
</div>

<div style="margin-top:20px;">
  <label>Email</label><br>
  <input [(ngModel)]="email" style="padding:8px; width:300px;" />
</div>

<div style="margin-top:20px;">
  <label>Téléphone</label><br>
  <input [(ngModel)]="phone" style="padding:8px; width:300px;" />
</div>

<div style="margin-top:20px;">
  <button (click)="create()" style="padding:10px 20px;">
    Créer
  </button>
</div>
